name: macOS

on:
  push:
    branches: [macos]
    paths-ignore:   # docs and community files don't need a Mac
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel   # Intel; the Apple-silicon pool (macos-latest) was out of capacity
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          persist-credentials: false
      - name: Install with the macOS script
        run: bash packaging/macos/install.sh
      - name: Installed command and app
        run: |
          czgram --version
          czgram --usage
          ls "$HOME/Applications/CzGram.app/Contents/MacOS" "$HOME/Applications/CzGram.app/Contents/Resources"
          head -1 "$HOME/Library/Application Support/CzGram/lib/czgram/nmhost.py"
      - name: The command ignores the folder it's started in
        # A czgram package or json.py in the current folder must not run instead of the installed copy.
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' czgram/__init__.py)
          mkdir -p /tmp/planted/czgram
          echo 'raise SystemExit("the planted czgram package ran")' > /tmp/planted/czgram/__init__.py
          cp /tmp/planted/czgram/__init__.py /tmp/planted/czgram/__main__.py
          echo 'raise SystemExit("the planted json.py ran")' > /tmp/planted/json.py
          cd /tmp/planted && czgram --version && test "$(czgram --version)" = "czgram $V"
      - name: Unit tests
        # pipefail: the tail would otherwise hide a failing test run.
        run: |
          set -o pipefail
          PYTHONPATH=. "$(brew --prefix)/bin/python3" -m unittest discover -s tests -v 2>&1 | tail -40
      - name: OCR, hotkeys and settings window
        run: PYTHONPATH=. "$(brew --prefix)/bin/python3" tests/mac_smoke.py
      - name: Uninstall
        run: |
          bash packaging/macos/uninstall.sh
          ! test -e "$HOME/Applications/CzGram.app"
